[project]
name = "pylekto"
# Set from the release's tag when it is built (.github/workflows/release.yml).
version = "0.0.0"
description = "Async Python client for the Lekto DMS REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["lekto", "dms", "document-management", "api-client", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.14"
# A library states lower bounds only; uv.lock pins the development environment.
dependencies = [
    "httpx2>=2.14",
    "pydantic>=2.14",
]

[project.urls]
"Source Code" = "https://github.com/lektohq/pylekto"
"Bug Reports" = "https://github.com/lektohq/pylekto/issues"

[dependency-groups]
dev = [
    "covdefaults>=2.3.0",
    "datamodel-code-generator>=0.88.0",
    "mypy>=2.4.1",
    "prek>=0.5.9",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "typos>=1.51.1",
    "yamllint>=1.38.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
# Generated from Lekto's OpenAPI description; its text is Lekto's.
extend-exclude = ["src/pylekto/models.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401", # Any is sometimes the honest type of a value
    "CPY001", # no copyright notice in every file
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D417",   # false positives
    "PLR2004", # magic values in comparisons
    "PLR0913", # too many arguments: not actionable without breaking the public API
    "RUF012", # mutable class attributes without ClassVar
    # Conflict with the Ruff formatter.
    "COM812",
    "ISC001",
]

# pydantic reads the annotations of a model at run time; get_type_hints those of a TypedDict.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "typing.TypedDict"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["pylekto"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.mypy]
strict = true
files = ["src", "tests", "script"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term --cov-report=xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["pylekto"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.typos.default]
# Keys and tokens (a push subscription's key): runs of base64url with a capital and a digit, which
# words and snake_case names have not.
extend-ignore-re = [
  "[A-Za-z0-9_-]*[A-Z][A-Za-z0-9_-]*[0-9][A-Za-z0-9_-]*",
  "[A-Za-z0-9_-]*[0-9][A-Za-z0-9_-]*[A-Z][A-Za-z0-9_-]*",
]

[tool.typos.files]
# Lekto's OpenAPI description, the models generated from it and the recorded answers hold Lekto's
# text: its examples and the German of its synthetic documents.
extend-exclude = ["uv.lock", "openapi.json", "src/pylekto/models.py", "tests/snapshot/"]

# The models from Lekto's OpenAPI description: script/generate_models.py writes them again from
# openapi.json with every choice open to new values, script/update_openapi.py fetches the
# description of another Lekto release first.
[tool.datamodel-codegen]
input-file-type = "openapi"
output = "src/pylekto/models.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.14"
use-annotated = true
use-standard-collections = true
use-union-operator = true
field-constraints = true
enum-field-as-literal = "all"
use-type-alias = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = '''# Generated by datamodel-codegen from openapi.json; do not edit. script/generate_models.py writes it.
"""The models of Lekto's REST API: what it takes and what it answers."""'''

---
# Git hooks, run by prek (`prek install`, which script/setup does; `prek run --all-files`).
repos:
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.215.0
    hooks:
      - id: renovate-config-validator
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        stages: [pre-commit, pre-push, manual]
      - id: no-commit-to-branch
        args:
          - --branch=main
      - id: trailing-whitespace
        stages: [pre-commit, pre-push, manual]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
  - repo: local
    hooks:
      - id: yamllint
        name: Check YAML files with yamllint
        language: system
        types: [yaml]
        entry: uv run yamllint
      - id: typos
        name: Check spelling with typos
        language: system
        types: [text]
        exclude: ^uv\.lock$
        entry: uv run typos --force-exclude
      - id: ruff-check
        name: Ruff linter
        language: system
        types: [python]
        entry: uv run ruff check --fix
        require_serial: true
        stages: [pre-commit, pre-push, manual]
      - id: ruff-format
        name: Ruff formatter
        language: system
        # Markdown too: Ruff formats the Python code blocks in it.
        types_or: [python, markdown]
        entry: uv run ruff format
        require_serial: true
        stages: [pre-commit, pre-push, manual]
      - id: mypy
        name: Static type checking with mypy
        language: system
        types: [python]
        entry: uv run mypy
        pass_filenames: false
        require_serial: true
      - id: pytest
        name: Tests and coverage with pytest
        language: system
        types: [python]
        entry: uv run pytest
        pass_filenames: false

name: PR labels

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# GitHub emits one `labeled` event per label, so a bot applying several labels queues several
# runs within a second. They are serialised rather than cancelled: Renovate reads every check run
# on the head commit and takes `cancelled` for neither pass nor fail, which parks its branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: read

jobs:
  pr_labels:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The pull request has a category label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_ATTEMPTS: "8"
          RETRY_DELAY: "5"
          VALID_LABELS: >-
            breaking-change bugfix ci dependencies dev-deps documentation
            enhancement maintenance new-feature performance refactor
        run: |
          # A bot opens the pull request first and adds its labels in a second call, so the
          # event and an immediate read can see none. A failure sticks to the commit, so wait
          # for the labels before calling the pull request unlabelled.
          matched=""
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if ! labels="$(gh api "repos/${PR_REPO}/pulls/${PR_NUMBER}" --jq '.labels[].name')"; then
              labels=""
            fi

            while IFS= read -r label; do
              [ -n "$label" ] || continue
              for valid in $VALID_LABELS; do
                if [ "$label" = "$valid" ]; then
                  matched="${matched:+$matched, }$label"
                fi
              done
            done <<< "$labels"

            if [ -n "$matched" ]; then
              break
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "No category label yet (attempt ${attempt}/${MAX_ATTEMPTS}), retrying in ${RETRY_DELAY}s"
              sleep "$RETRY_DELAY"
            fi
          done

          if [ -z "$matched" ]; then
            echo "::error title=Missing label::This pull request needs one of these labels: ${VALID_LABELS}"
            exit 1
          fi

          echo "Category label: ${matched}"

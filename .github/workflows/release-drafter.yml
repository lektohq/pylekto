name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

# The default token may only read; the drafter writes the release draft and reads the pull
# requests.
permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
